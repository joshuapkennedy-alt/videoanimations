<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
html,body{margin:0;background:#EEE5D4}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#EEE5D4}
#map{position:absolute;left:0;top:0;width:1640px;height:2160px;transform-origin:0 0}
#map img{position:absolute;left:0;top:0;width:1640px;height:2160px}
#fx{position:absolute;left:0;top:0}
#shade{position:absolute;left:0;top:0;width:1080px;height:560px;background:linear-gradient(#EEE5D4 0%,#EEE5D4 55%,rgba(238,229,212,0) 100%)}
</style></head>
<body><div id="stage">
  <div id="map"><img src="muted.png"><img id="su" src="su_layer.png"></div>
  <svg id="fx" width="1080" height="1920"></svg>
</div>
<script src="lib.js"></script>
<script>
// Saale-Unstrut region card: Germany fades in, the region lights up and pulses, then the map zooms in on it
const IMG = { w: 1640, h: 2160 }, SU = { x: 1035, y: 1065 };   // region centre in map-image pixels
const S0 = 0.62, Z = 2.8;                                       // start scale, zoom factor
const P0 = { x: 540, y: 960 }, P1 = { x: 540, y: 960 };       // where the map centre / region centre sit
const map = document.getElementById('map'), su = document.getElementById('su'), fx = document.getElementById('fx');
const NS = 'http://www.w3.org/2000/svg', lerp = (a, b, k) => a + (b - a) * k;

// screen position of the region centre for a given zoom progress
function view(k) {
  const s = S0 * lerp(1, Z, k);
  const sx0 = P0.x + (SU.x - IMG.w / 2) * S0, sy0 = P0.y + (SU.y - IMG.h / 2) * S0;   // region on screen before zoom
  const cx = lerp(sx0, P1.x, k), cy = lerp(sy0, P1.y, k);
  return { s, tx: cx - SU.x * s, ty: cy - SU.y * s, cx, cy };
}
const glow = document.createElementNS(NS, 'circle'); fx.appendChild(glow);
glow.setAttribute('fill', 'url(#g)');
fx.innerHTML = '<defs><radialGradient id="g"><stop offset="0" stop-color="#C9D36A" stop-opacity=".55"/><stop offset="1" stop-color="#C9D36A" stop-opacity="0"/></radialGradient></defs>';
fx.appendChild(glow);
const rings = [0, 1, 2, 3, 4].map(() => { const c = document.createElementNS(NS, 'circle'); c.setAttribute('fill', 'none'); c.setAttribute('stroke', '#8E9F2E'); fx.appendChild(c); return c; });
const dot = document.createElementNS(NS, 'circle'); fx.appendChild(dot);

anims.push(t => {
  const k = ease(seg(t, 2.6, 4.7)), v = view(k);
  const intro = eout(seg(t, 0, 0.7));
  map.style.transform = `translate(${v.tx}px, ${v.ty}px) scale(${v.s * lerp(0.97, 1, intro)})`;
  map.style.opacity = intro;
  su.style.opacity = eout(seg(t, 0.9, 1.4));
  // soft glow and pulse rings, sized in screen space so they read the same before and after the zoom
  const on = seg(t, 1.1, 1.5);
  glow.setAttribute('cx', v.cx); glow.setAttribute('cy', v.cy);
  glow.setAttribute('r', lerp(110, 190, k) * (1 + 0.08 * Math.sin(t * 4.4))); glow.setAttribute('opacity', on);
  rings.forEach((c, i) => {
    const p = (t - 1.3 - i * 1.4) / 1.6;
    if (p < 0 || p > 1) { c.setAttribute('opacity', 0); return; }
    c.setAttribute('cx', v.cx); c.setAttribute('cy', v.cy);
    c.setAttribute('r', lerp(30, lerp(150, 230, k), eout(p))); c.setAttribute('stroke-width', lerp(6, 2, p));
    c.setAttribute('opacity', (1 - p) * 0.9);
  });
});
// river labels, placed for the zoomed-in view (the map is static once the zoom ends)
function riverLabel(str, x, y, anchor, a) {
  const tx = document.createElementNS(NS, 'text');
  Object.entries({ x, y, 'text-anchor': anchor, fill: '#3F6B8A', stroke: '#F8F3EA', 'stroke-width': 9, 'stroke-linejoin': 'round', 'paint-order': 'stroke',
    'font-family': 'PFI', 'font-style': 'italic', 'font-size': 52, 'letter-spacing': 1 }).forEach(([k, v]) => tx.setAttribute(k, v));
  tx.textContent = str; fx.appendChild(tx);
  anims.push(t => { const k = eout(seg(t, a, a + 0.5)); tx.style.opacity = k; tx.style.transform = `translateY(${10 * (1 - k)}px)`; });
}
riverLabel('Saale', 566, 1318, 'start', 4.9);
riverLabel('Unstrut', 432, 872, 'end', 5.25);
render(0);
</script></body></html>
