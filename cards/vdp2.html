<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
html,body{margin:0;background:#EEE5D4}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#EEE5D4}
</style></head>
<body><div id="stage"></div>
<script src="lib.js"></script>
<script>
// Opens on the end frame of systems_squeeze (1971 left, 2021 right), pushes 1971 out,
// moves 2021 into the left column in the VDP layout, then builds the VDP side.
const LX = 275, RX = 805, W = 480;                   // squeeze layout
const GX = 290, GW = 520, VX = 835, VW = 430, BX = 620, BRX = 600; // VDP layout
const LN = Object.assign({}, T.note, { font: '400 22px Inter' });
const sub28 = Object.assign({}, T.sub, { font: '400 28px Inter' });
const lerp = (a, b, k) => a + (b - a) * k;
const MOVE = [1.0, 2.1];                              // when 2021 travels left
const mk = t => ease(seg(t, MOVE[0], MOVE[1]));

// ---- divider + Germany 1971 (pushed out) ----
const dv = div({ left: '539px', top: '190px', width: '2px', height: '1540px', background: C.divider });
anims.push(t => { dv.style.opacity = 1 - seg(t, 0.6, 1.1); });
const g71 = div({ left: 0, top: 0, width: '1080px', height: '1920px' });
text(LX, 190, W, 'Germany', T.title, g71);
text(LX, 296, W, 'Ranked by ripeness', T.sub, g71);
text(LX, 410, W, '1971 WINE LAW', T.eyebrow, g71);
pyramid(g71, LX, 480, 1320, 250, 490, [
  { name: 'Prädikatswein', sub: 'Kabinett to TBA', color: '#9E773A', light: 1 },
  { name: 'Qualitätswein', sub: 'from one of 13 regions', color: '#CDA767' },
  { name: 'Landwein', sub: 'country wine', color: '#E0C895' },
  { name: 'Deutscher Tafelwein', sub: 'table wine', color: '#EFE1C6' }], { nameSize: 36 });
text(LX, 1372, W, 'THE 1971 LAW ALSO SET', T.eyebrow, g71);
text(LX, 1412, W, 'approved varieties · must weight<br>official test number (A.P.-Nr.)', T.note, g71);
text(LX, 1590, W, 'The harvest is ranked', T.ital, g71);
anims.push(t => { const k = ease(seg(t, 0.6, 1.5)); g71.style.translate = `${-640 * k}px 0`; g71.style.opacity = 1 - seg(t, 0.6, 1.3); });

// ---- Germany 2021: header moves and swaps its subtitle ----
function mover(html, style, a, b) { // a,b = {cx,y,w}
  const d = text(a.cx, a.y, a.w, html, style);
  anims.push(t => { const k = mk(t); d.style.left = (lerp(a.cx, b.cx, k) - lerp(a.w, b.w, k) / 2) + 'px'; d.style.top = lerp(a.y, b.y, k) + 'px'; d.style.width = lerp(a.w, b.w, k) + 'px'; });
  return d;
}
mover('Germany', T.title, { cx: RX, y: 190, w: W }, { cx: GX, y: 170, w: GW });
const subA = mover('Ranked by place, like France', T.sub, { cx: RX, y: 296, w: W }, { cx: GX, y: 280, w: GW });
const subB = mover('What the law sets<br>for every producer', sub28, { cx: RX, y: 296, w: W }, { cx: GX, y: 280, w: GW });
fadeOut(subA, 1.0, 0.4); fadeIn(subB, 1.6, 0.5, 0);
mover('2021 WINE LAW', T.eyebrow, { cx: RX, y: 410, w: W }, { cx: GX, y: 380, w: GW });
fadeOut(text(RX, 1372, W, 'AND STILL KEEPS', T.eyebrow), 0.6, 0.4);
fadeOut(text(RX, 1412, W, 'Kabinett to TBA as ripeness terms<br>stricter rules as the origin narrows', T.note), 0.6, 0.4);
fadeOut(text(RX, 1590, W, 'The land is ranked now too', T.ital), 0.6, 0.4);

// ---- Germany 2021 pyramid: morphs between the two layouts ----
function geom(cx, y0, y1, wt, wb, hs, gap = 7) {
  const tot = hs.reduce((s, h) => s + h, 0), avail = (y1 - y0) - gap * (hs.length - 1);
  const halfAt = y => (wt + (wb - wt) * (y - y0) / (y1 - y0)) / 2;
  let y = y0; return { halfAt, cx, layers: hs.map(hh => { const h = avail * hh / tot, r = { y, h, ht: halfAt(y), hb: halfAt(y + h) }; y += h + gap; return r; }) };
}
const GA = geom(RX, 480, 1320, 250, 490, [1.45, 1, 1, 1, 1, 1]);
const GB = geom(GX, 440, 1290, 250, GW, [1.9, 1, 1, 1, 1, 1]);
const LAY = [
  { name: 'Lagenwein', sub: 'single vineyard', extra: 'regions may add<br>Erstes · Großes Gewächs', color: '#4D5430', light: 1 },
  { name: 'Ortswein', sub: 'one village', color: '#697246', light: 1 },
  { name: 'Region', sub: 'e.g. Bereich Bernkastel', subB: 'a smaller area within it', color: '#89915E', light: 1 },
  { name: 'Anbaugebiet', sub: 'one of 13 regions', color: '#ADB484' },
  { name: 'Landwein', sub: 'country wine', color: '#CBD0AC' },
  { name: 'Deutscher Wein', sub: 'table wine', color: '#E3E6D0' }];
LAY.forEach((l, i) => {
  const d = div({ background: l.color, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center' });
  const fg = l.light ? C.cream : C.ink;
  const nm = div({ position: 'static', font: '700 32px PF', color: fg, lineHeight: '1.1' }, l.name, d);
  const sb = div({ position: 'relative', font: '400 20px Inter', color: fg, opacity: .85, marginTop: '4px' }, l.sub, d);
  let sb2; if (l.subB) { sb2 = div({ left: 0, right: 0, top: 0, font: '400 20px Inter', color: fg, opacity: 0, whiteSpace: 'nowrap' }, l.subB, sb); }
  if (l.extra) div({ position: 'static', font: '600 17px Inter', color: '#E0C78C', marginTop: '6px', lineHeight: '1.25' }, l.extra, d);
  const A = GA.layers[i], B = GB.layers[i];
  anims.push(t => {
    const k = mk(t), cx = lerp(GA.cx, GB.cx, k), y = lerp(A.y, B.y, k), h = lerp(A.h, B.h, k), ht = lerp(A.ht, B.ht, k), hb = lerp(A.hb, B.hb, k);
    Object.assign(d.style, { left: (cx - hb) + 'px', top: y + 'px', width: 2 * hb + 'px', height: h + 'px', clipPath: `polygon(${hb - ht}px 0, ${hb + ht}px 0, ${2 * hb}px 100%, 0 100%)` });
    nm.style.fontSize = lerp(32, 34, k) + 'px';
    if (sb2) { const c = seg(t, 1.5, 1.9); sb.style.color = `rgba(246,238,223,${1 - c})`; sb2.style.opacity = c; sb2.style.color = C.cream; }
  });
});
fadeIn(text(GX, 1345, GW, 'THE 2021 LAW ALSO SETS', T.eyebrow), 2.2);
fadeIn(text(GX, 1385, GW, 'stricter varieties and yields<br>as the origin narrows<br>collective sites can no longer<br>pose as single vineyards', LN), 2.3);

// ---- VDP: members' classification ----
const V0 = 2.8;
fadeIn(text(VX, 170, VW, 'VDP', T.title), V0);
fadeIn(text(VX, 280, VW, 'About 200 estates,<br>stricter rules', sub28), V0 + 0.1);
fadeIn(text(VX, 381, VW, "MEMBERS' CLASSIFICATION", Object.assign({}, T.eyebrow, { font: '600 20px Inter', letterSpacing: '3.5px' })), V0 + 0.2);

function connector(y, a) {
  const x0 = GB.cx + GB.halfAt(y) + 14;
  const d = div({ left: x0 + 'px', top: (y - 1) + 'px', width: (BRX - 8 - x0) + 'px', height: 0, borderTop: `2px dashed ${C.dash}`, transformOrigin: 'left' });
  anims.push(t => { const k = ease(seg(t, a, a + 0.4)); d.style.transform = `scaleX(${k})`; d.style.opacity = k > 0 ? 1 : 0; });
}
function bracket(y0, y1, a) {
  const b = div({ left: BRX + 'px', top: y0 + 'px', width: '10px', height: (y1 - y0) + 'px', border: `3px solid ${C.boxGold}`, borderRight: 'none', boxSizing: 'border-box' });
  anims.push(t => { const k = ease(seg(t, a, a + 0.3)); b.style.opacity = k; b.style.transform = `scaleY(${k})`; });
}
function vbox(y0, y1, html, a, extra = {}) {
  const b = div(Object.assign({ left: BX + 'px', top: y0 + 'px', width: (1050 - BX) + 'px', height: (y1 - y0) + 'px', background: C.box, borderRadius: '9px',
    boxSizing: 'border-box', padding: '0 24px', display: 'flex', flexDirection: 'column', justifyContent: 'center', color: C.cream }, extra), html);
  anims.push(t => { const k = eout(seg(t, a, a + 0.45)); b.style.opacity = k; b.style.translate = `${60 * (1 - k)}px 0`; });
}
const nm = (s, size = 32) => `<div style="font:700 ${size}px PF;line-height:1.1">${s}</div>`;
const ds = s => `<div style="font:400 20px Inter;color:rgba(246,238,223,.85);margin-top:5px;line-height:1.3">${s}</div>`;
const L = GB.layers.map(p => ({ top: p.y, bot: p.y + p.h, mid: p.y + p.h / 2 }));
const half = (L[0].top + L[0].bot) / 2, s = V0 + 0.6;
connector(L[2].mid, s); connector(L[3].mid, s); bracket(L[2].top, L[3].bot, s + 0.1);
vbox(L[2].top, L[3].bot, nm('Gutswein', 40) + ds("the estate's entry wine"), s + 0.2);
connector(L[1].mid, s + 0.5); bracket(L[1].top, L[1].bot, s + 0.55);
vbox(L[1].top, L[1].bot, nm('Ortswein') + ds("from a village's better sites"), s + 0.6);
connector(L[0].top + (L[0].bot - L[0].top) * 0.75, s + 0.9); bracket(half + 4, L[0].bot, s + 0.95);
vbox(half + 4, L[0].bot, nm('Erste Lage') + ds('first-class site, like Premier Cru'), s + 1.0);
connector(L[0].top + (L[0].bot - L[0].top) * 0.25, s + 1.5); bracket(L[0].top, half - 4, s + 1.55);
vbox(L[0].top, half - 4, nm('Große Lage') + ds('top vineyard, like Grand Cru') + `<div style="font:600 20px Inter;color:#E0C78C;margin-top:3px">dry wines: GG</div>`, s + 1.6, { border: `3px solid ${C.boxGold}` });
fadeIn(div({ left: BX + 'px', top: L[4].top + 'px', width: (1050 - BX) + 'px', height: (L[5].bot - L[4].top) + 'px', border: `2px dashed ${C.dash}`, borderRadius: '9px',
  boxSizing: 'border-box', display: 'flex', alignItems: 'center', justifyContent: 'center', font: '400 23px Inter', color: '#6A5C4A' }, 'not used by VDP members'), s + 2.2, 0.45, 0);
fadeIn(text(VX, 1345, VW, 'THE VDP ADDS', T.eyebrow), s + 3.0);
fadeIn(text(VX, 1385, VW, 'hand harvest and lower<br>yields at the top<br>GG: dry, at least Spätlese<br>ripeness, released later', LN), s + 3.1);
fadeIn(text(540, 1580, 1000, 'VDP wines are still Qualitätswein or Prädikatswein by law,<br>just made under stricter rules', Object.assign({}, T.ital, { font: 'italic 400 34px PFI' })), s + 3.5);
render(0);
</script></body></html>
