<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
html,body{margin:0;background:#EEE5D4}
svg{display:block}
</style></head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const C={bg:'#EEE5D4',wine:'#6B2636',ink:'#281D16',eyebrow:'#7B6954',ring:'#CCBDA7',icon:'#C2AF92',line:'#C3A06A',label:'#ABA084',cream:'#F1E6D6'};
const TOPICS=['Rivers & climate','Grapes','Sweet or dry?','Wine law','Reading a label','Outside the 13','Far from home'];
// icons drawn in a 100x100 box centred on 50,50
const ICONS=[
 `<path d="M18 36c6-6 11-6 16 0s11 6 16 0 11-6 16 0 11 6 16 0"/><path d="M18 51c6-6 11-6 16 0s11 6 16 0 11-6 16 0 11 6 16 0"/><path d="M18 66c6-6 11-6 16 0s11 6 16 0 11-6 16 0 11 6 16 0"/>`,
 `<circle cx="38" cy="42" r="7"/><circle cx="52" cy="42" r="7"/><circle cx="66" cy="42" r="7"/><circle cx="45" cy="55" r="7"/><circle cx="59" cy="55" r="7"/><circle cx="52" cy="68" r="7"/><path d="M58 35c2-8 6-12 12-13"/><path d="M60 28c4-6 12-6 16-2-5 4-11 5-16 2z"/>`,
 `<path d="M50 24 74 37v27L50 77 26 64V37z"/><path d="M26 37 50 50 74 37M50 50v27"/>`,
 `<path d="M50 24 78 72H22z"/><path d="M38 45h24M30 59h40"/>`,
 `<path d="M44 20h12v14c0 4 8 8 8 16v26c0 3-2 5-5 5H41c-3 0-5-2-5-5V50c0-8 8-12 8-16z"/><rect x="40" y="56" width="20" height="14" rx="2"/>`,
 `<path d="M28 30 50 26 54 50 44 74 26 68z" stroke-dasharray="4 4"/><path d="M68 54c-6-7-9-12-9-16a9 9 0 0 1 18 0c0 4-3 9-9 16z"/><circle cx="68" cy="38" r="3"/>`,
 `<path d="M32 74c-5-6-8-10-8-14a8 8 0 0 1 16 0c0 4-3 8-8 14z"/><circle cx="32" cy="60" r="2.5"/><path d="M70 58c-5-6-8-10-8-14a8 8 0 0 1 16 0c0 4-3 8-8 14z"/><circle cx="70" cy="44" r="2.5"/><path d="M40 52c6-10 12-14 20-16" stroke-dasharray="3 5"/>`
];
const clamp=x=>Math.max(0,Math.min(1,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const easeOut=x=>1-Math.pow(1-x,3);
const easeInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const backOut=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const mix=(a,b,k)=>{const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join('')};
const esc=s=>s.replace(/&/g,'&amp;');

// layout
const NX=372, LX=470, Y0=820, DY=134, R=50, RA=58;

function fitSize(text,weight,size,maxW){
  const c=document.createElement('canvas').getContext('2d');
  c.font=`${weight} ${size}px PF`;const w=c.measureText(text).width;
  return w>maxW?size*maxW/w:size;
}

window.render=function(t,active){
  const s=document.getElementById('s');let o=`<rect width="1080" height="1920" fill="${C.bg}"/>`;
  // heading
  const h=easeOut(seg(t,0.1,0.55));
  o+=`<text x="540" y="${330+14*(1-h)}" text-anchor="middle" font-family="PF" font-weight="700" font-size="96" fill="${C.wine}" opacity="${h}">The big picture</text>`;
  // eyebrow + topic title
  const tt=easeOut(seg(t,2.0,2.55));
  o+=`<text x="540" y="${480+18*(1-tt)}" text-anchor="middle" font-family="Inter" font-weight="600" font-size="30" letter-spacing="7" fill="${C.eyebrow}" opacity="${tt}">THE BIG PICTURE · ${active+1} OF 7</text>`;
  const title=TOPICS[active], fs=fitSize(title,800,128,960);
  o+=`<text x="540" y="${612+24*(1-tt)}" text-anchor="middle" font-family="PF" font-weight="800" font-size="${fs}" fill="${mix(C.bg,C.ink,tt)}" opacity="${Math.min(1,tt*1.6)}">${esc(title)}</text>`;
  // timeline
  const tl=easeOut(seg(t,0.15,0.6));
  o+=`<g opacity="${tl}">`;
  for(let i=0;i<6;i++)o+=`<line x1="${NX}" x2="${NX}" y1="${Y0+i*DY+R}" y2="${Y0+(i+1)*DY-R}" stroke="${C.line}" stroke-width="3"/>`;
  const fill=easeInOut(seg(t,1.55,1.95)), lab=easeOut(seg(t,1.8,2.2));
  TOPICS.forEach((name,i)=>{
    const y=Y0+i*DY, on=i===active;
    o+=`<circle cx="${NX}" cy="${y}" r="${R}" fill="${C.bg}" stroke="${C.ring}" stroke-width="3"/>`;
    const sc=R*1.6/100;
    o+=`<g transform="translate(${NX-50*sc} ${y-50*sc}) scale(${sc})" fill="none" stroke="${C.icon}" stroke-width="${3/sc*0.9}" stroke-linecap="round" stroke-linejoin="round">${ICONS[i]}</g>`;
    const lc=on?mix(C.label,C.ink,lab):C.label, lw=on&&lab>.5?600:400;
    o+=`<text x="${LX}" y="${y+14}" font-family="Inter" font-weight="${lw}" font-size="40" fill="${lc}">${esc(name)}</text>`;
  });
  o+='</g>';
  // active node: dot pops in, then floods the circle with a ripple ring
  const y=Y0+active*DY;
  const dot=seg(t,0.5,0.8);
  if(dot>0){
    const rr=8*backOut(dot)+(RA-8)*fill;
    o+=`<circle cx="${NX}" cy="${y}" r="${rr}" fill="${C.wine}" opacity="${0.45+0.55*Math.max(1-fill*1.2,fill)}"/>`;
    if(fill<1)o+=`<circle cx="${NX}" cy="${y}" r="${8*backOut(dot)*(1-fill)}" fill="${C.wine}"/>`;
  }
  const rip=seg(t,1.55,2.5);
  if(rip>0&&rip<1){const e=easeOut(rip);o+=`<circle cx="${NX}" cy="${y}" r="${R+4+44*e}" fill="none" stroke="${C.wine}" stroke-width="3" opacity="${(1-rip)*0.9}"/>`;}
  if(fill>0){const sc=RA*1.6/100*0.9;o+=`<g transform="translate(${NX-50*sc} ${y-50*sc}) scale(${sc})" fill="none" stroke="${C.cream}" stroke-width="${3.4/sc}" stroke-linecap="round" stroke-linejoin="round" opacity="${seg(t,1.75,2.0)}">${ICONS[active]}</g>`;}
  s.innerHTML=o;
};
</script></body></html>
